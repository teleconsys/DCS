name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.24']
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - run: go vet ./...

    - name: Run tests (excluding cmd/cli/ipfs)
      run: |
        set -euo pipefail
        PKGS="$(go list ./... | grep -vE '/cmd/cli/ipfs$')"
        go test -v $PKGS

    - run: go build ./...
