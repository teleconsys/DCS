name: CI

on: # Trigger the workflow on every push or pull request
  pull_request: 
    branches: [main]         
  push:                  
    branches: [main]

jobs:
  test:
    # Run on major OSes 
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.24']      
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4             # pull the code
    - uses: actions/setup-go@v5             # install Go
      with:
        go-version: ${{ matrix.go }}
    - run: go vet ./...                     # static checks :contentReference[oaicite:1]{index=1}
    - run: go test -v ./...                 # run smoke test
    - run: go build ./...                   # build every package
